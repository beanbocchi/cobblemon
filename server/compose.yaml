# Play server. Start: docker compose up -d   Console: docker exec -it cobbleverse rcon-cli
services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: cobbleverse
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      DIFFICULTY: normal
      PVP: "false"
      TYPE: MODRINTH
      MODRINTH_MODPACK: /pack/latest.mrpack
      MEMORY: ${MEMORY:-8G}
      USE_AIKAR_FLAGS: "true"
      # Offline mode lets non-premium launchers (TLauncher) join; set ONLINE_MODE=true in .env to require Mojang accounts.
      ONLINE_MODE: ${ONLINE_MODE:-true}
      ENFORCE_SECURE_PROFILE: ${ENFORCE_SECURE_PROFILE:-true}
      VIEW_DISTANCE: 10
      MOTD: '${MOTD:-\u00A76\u00A7k|||\u00A7r \u00A7c\u00A7lSIX SEVEN \u00A7r\u00A7e\u00A7lCOBBLEVERSE \u00A7r\u00A77(bootleg) \u00A76\u00A7k|||\n\u00A77Runs on borrowed RAM \u00A78\u2022 \u00A7aPok\u00E9mon catch themselves \u00A7c\u00A7l\u00A7k67\u00A7r\u00A7a%}'
      ICON: /branding/server-icon.png
      OVERRIDE_ICON: "TRUE"
      SIMULATION_DISTANCE: 8
    volumes:
      - ./data:/data
      - ../dist:/pack:ro
      - ./branding:/branding:ro
    ports:
      - "${BIND:-127.0.0.1}:25565:25565"
    restart: unless-stopped
